<title>Flying bee</title>
<style>.bee{animation:hover 1.2s ease-in-out infinite alternate}.wing{transform-origin:62px 59px;animation:flap .14s ease-in-out infinite alternate}.rear{animation-delay:-.07s}@keyframes flap{from{transform:rotate(-18deg) scaleY(.55)}to{transform:rotate(16deg) scaleY(1)}}@keyframes hover{to{transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.bee,.wing{animation:none}}</style>
